services:

  mysql:
    image: mysql:8.0
    container_name: cloudvault-mysql
    restart: always

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: cloudvault-backend
    restart: always

    environment:
      PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: ${DB_HOST}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      DB_PORT: ${DB_PORT}
      
      # Azure Storage Configuration
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_CONTAINER_NAME: ${AZURE_CONTAINER_NAME:-cloudvault}
      
      # Security
      CORS_ORIGIN: ${CORS_ORIGIN:-*}

    ports:
      - "${BACKEND_PORT}:5000"

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend

    container_name: cloudvault-frontend
    restart: always

    ports:
      - "${FRONTEND_PORT}:80"

    depends_on:
      - backend

volumes:
  mysql_data:
  backend_uploads:
